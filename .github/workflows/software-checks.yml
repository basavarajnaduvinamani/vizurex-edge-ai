name: Software checks
on: [push, pull_request]
jobs:
  boundaries:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install torch==2.7.0 torchvision==0.22.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-software-windows-lock.txt
      - run: python -m pip check
      - run: python -m pytest backend/test_api.py backend/test_network.py backend/test_quality.py backend/test_bundles.py backend/test_model_restore.py backend/test_portable.py scripts/test_capture_manifest.py scripts/test_dataset_validator.py -q
      - run: node scripts/test_frontend.mjs
      # Real models/datasets remain private local artifacts; CI does not fabricate results.
